[package]
name = "dsh-mobile-iroh-host"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
iroh = "1.0.0"
rand = "0.9"
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "pem", "x509-parser"] }
sha2 = "0.11"
dsh-mobile-iroh-core = { path = "../tether-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "signal"] }
sys-locale = "0.3.2"
time = "0.3"
x509-parser = { version = "0.18.1", features = ["verify"] }
