[package]
name = "dsh-mobile-iroh-android-transport"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
anyhow = "1"
dsh-mobile-iroh-core = { path = "../tether-core" }
iroh = "1.0.0"
jni = "0.21"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }
